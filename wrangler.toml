name = "ngo-nhat-truong-astro"
main = "@astrojs/cloudflare/entrypoints/server"
account_id = "7f3ac865c1b6f8baf7bd7a10795077b9"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]

[vars]
ADMIN_USERNAME = "ngonhattruong"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ngo-nhat-truong-cms"
database_id = "6b395722-8012-4dcf-94ca-95812d1c039f"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ngo-nhat-truong-media"

[[routes]]
pattern = "ngonhattruong.com/admin*"
zone_name = "ngonhattruong.com"

[[routes]]
pattern = "ngonhattruong.com/api/*"
zone_name = "ngonhattruong.com"

[[routes]]
pattern = "ngonhattruong.com/media/*"
zone_name = "ngonhattruong.com"

[[routes]]
pattern = "www.ngonhattruong.com/admin*"
zone_name = "ngonhattruong.com"

[[routes]]
pattern = "www.ngonhattruong.com/api/*"
zone_name = "ngonhattruong.com"

[[routes]]
pattern = "www.ngonhattruong.com/media/*"
zone_name = "ngonhattruong.com"

[[routes]]
pattern = "ngonhattruong.com/_astro/*"
zone_name = "ngonhattruong.com"

[[routes]]
pattern = "www.ngonhattruong.com/_astro/*"
zone_name = "ngonhattruong.com"
